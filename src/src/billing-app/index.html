<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Запросить счёт или акт</title><link rel="stylesheet" href="/legal/billing/app.css"><script src="https://api.bitrix24.com/api/v1/"></script><script type="module" src="/legal/billing/app.mjs"></script><body data-source-id="__SOURCE_ID__"><main><h1>Запросить счёт или акт</h1><p>Заявка будет создана от вашего имени и направлена вашему руководителю.</p><form id="load"><label>Номер заявки договора <input id="source" type="number" min="1" required></label><button>Загрузить договор</button></form><p id="status" role="status"></p><section id="details" hidden><h2 id="counterparty"></h2><p id="contact"></p><form id="create"><label>Что подготовить<select name="kind"><option value="invoice">Счёт</option><option value="act">Акт</option><option value="both">Счёт + акт</option></select></label><label>Сумма и валюта<input name="amount" maxlength="120" required></label><label>Период или основание<input name="period" maxlength="200" required></label><label>Задача<textarea name="task" rows="4" maxlength="3000" required></textarea></label><label>Желаемая дата результата<input name="dueDate" type="date" required></label><button id="submit">Создать заявку</button></form></section><p><a id="result" hidden>Открыть созданную заявку</a></p></main></body></html>
